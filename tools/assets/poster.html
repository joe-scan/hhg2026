<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:800px;height:1200px;background:#0d0420;color:#fff;font-family:"Press Start 2P",monospace;
       padding:56px 52px 48px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .top{font-size:16px;letter-spacing:.3em;color:#22e6ff}
  .rule{width:100%;height:2px;background:#2a1a4a;margin:22px 0 30px}
  .art{width:100%;border:6px solid #1d1235;background:#000;display:block;image-rendering:pixelated}
  .starring{font-size:12px;letter-spacing:.3em;color:#b9aee0;margin:44px 0 14px}
  .name{font-family:"Bungee",sans-serif;font-size:118px;line-height:.92;color:#fff;text-shadow:6px 6px 0 #ff2bd6}
  .occ{font-family:"Bungee",sans-serif;font-size:56px;letter-spacing:.01em;color:#ffd23f;margin-top:54px;line-height:1.05}
  .credits{font-size:17px;line-height:2.4;letter-spacing:.1em;color:#b9aee0;margin-top:52px}
  .credits b{color:#e8e4f6;font-weight:400}
  .foot{font-size:15px;letter-spacing:.2em;color:#8f7fc0;margin-top:auto}
  .strip{display:flex;gap:10px;width:100%;margin-top:54px}
  .strip img{width:calc((100% - 20px)/3);border:4px solid #1d1235;image-rendering:pixelated;display:block}
  .bulbs{display:flex;gap:14px;margin-top:30px}
  .bulbs i{width:10px;height:10px;background:#ff2bd6;border-radius:50%}
  .bulbs i:nth-child(even){background:#ffd23f}
</style></head><body>
  <div class="top">HAPPYHEROGAMES PRESENTS</div>
  <div class="rule"></div>
  <img class="art" src="title.png" alt="">
  <div class="occ">HAPPY BIRTHDAY, AVA</div>
  <div class="bulbs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="strip"><img src="frames/f045.png" alt=""><img src="shot-balloon.png" alt=""><img src="frames/f080.png" alt=""></div>
  <div class="credits">
    WITH <b>DAD</b> AS THE OPPONENT<br>
    AND <b>BISCUIT</b> AS THE REFEREE<br>
    FIVE GAMES &middot; ONE BOSS &middot; ONE HERO
  </div>
  <div class="foot">HAPPYHEROGAMES.COM</div>
</body></html>
