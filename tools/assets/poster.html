<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- The printed poster in the gift box. Cream paper, ink type and the game's own colours, so it
     matches the site and prints without drowning a cartridge. Rendered by tools/assets/render.mjs
     at 800x1200, twice the scale, then resized to 900 wide. -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bowlby+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:800px;height:1200px;background:#fdf5ec;color:#2a1a12;font-family:"Atkinson Hyperlegible",sans-serif;
       padding:54px 54px 44px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .top{font-family:"Press Start 2P",monospace;font-size:13px;letter-spacing:.24em;color:#8d7f6f}
  .rule{width:100%;height:3px;background:#2a1a12;margin:20px 0 28px}
  .art{width:100%;border:5px solid #2a1a12;display:block;image-rendering:pixelated}
  .occ{font-family:"Bowlby One",sans-serif;font-size:62px;letter-spacing:-.01em;color:#2a1a12;margin-top:46px;line-height:1.02}
  .occ em{font-style:normal;color:#f2711c}
  .bulbs{display:flex;gap:16px;margin-top:26px}
  .bulbs i{width:12px;height:12px;background:#f2711c}
  .bulbs i:nth-child(even){background:#ffcc00}
  .strip{display:flex;gap:12px;width:100%;margin-top:46px}
  .strip img{width:calc((100% - 24px)/3);border:4px solid #2a1a12;image-rendering:pixelated;display:block}
  .credits{font-size:21px;line-height:1.9;margin-top:44px;color:#6b5546}
  .credits b{color:#2a1a12}
  .foot{font-family:"Press Start 2P",monospace;font-size:12px;letter-spacing:.24em;color:#8d7f6f;margin-top:auto;padding-top:34px}
</style></head><body>
  <div class="top">HappyHeroGames presents</div>
  <div class="rule"></div>
  <img class="art" src="title.png" alt="">
  <div class="occ">Happy Birthday,<br><em>Ava</em></div>
  <div class="bulbs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="strip"><img src="frames/f045.png" alt=""><img src="shot-balloon.png" alt=""><img src="frames/f080.png" alt=""></div>
  <div class="credits">
    With <b>Dad</b>, <b>Mum</b> and <b>Jack</b> as the opponents<br>
    and <b>Biscuit</b> as the referee<br>
    Five games &middot; one hero
  </div>
  <div class="foot">HappyHeroGames.com</div>
</body></html>
